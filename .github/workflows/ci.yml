name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit + e2e (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Start Redis, S3 (SeaweedFS), DynamoDB Local, PostgreSQL, OpenFGA
        run: scripts/services.sh up
      - name: Unit and conformance tests against every backend
        run: |
          eval "$(scripts/services.sh env)"
          pnpm test
      - name: End-to-end scenarios
        run: bash scripts/e2e.sh local dev services docker compose
      - if: always()
        run: scripts/services.sh down

  identity:
    name: sign-in and OpenFGA e2e (x86_64)
    # Real Dex, oauth2-proxy and OpenFGA containers, signed into over HTTP. Separate from `test`
    # so the two run in parallel.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the backing services (betterauth also runs against PostgreSQL)
        run: scripts/services.sh up
      - name: End-to-end scenarios for every sign-in mode and OpenFGA
        run: bash scripts/e2e.sh proxy proxyoauth oidc betterauth openfga
      - if: always()
        run: scripts/services.sh down

  lambda-arm64:
    name: Lambda Web Functions contract (arm64)
    # Lambda Web Functions only run on arm64, so this job runs the packaged app on arm64 too.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/services.sh up
      - run: bash scripts/e2e.sh lambda
      - if: always()
        run: scripts/services.sh down
